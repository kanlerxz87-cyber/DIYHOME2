<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" role="img" aria-label="Editorial illustration of matte black under-cabinet aluminum paper towel holder">
  <rect width="360" height="220" rx="12" fill="#f3efe8"/>
  <!-- Cabinet underside -->
  <rect x="24" y="24" width="312" height="34" rx="4" fill="#dfd5c5" stroke="#18221e" stroke-width="2.2"/>
  <line x1="24" y1="42" x2="336" y2="42" stroke="#c3b6a2" stroke-width="1.5"/>
  <!-- Mounting plate -->
  <rect x="64" y="58" width="168" height="10" rx="2" fill="#18221e"/>
  <!-- Screw & Adhesive indicator dots -->
  <circle cx="88" cy="63" r="2.5" fill="#faf8f4"/>
  <circle cx="208" cy="63" r="2.5" fill="#faf8f4"/>
  <!-- Matte black aluminum arm & rail -->
  <path d="M84 68 L84 128 L272 128 L272 114" fill="none" stroke="#18221e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Paper towel roll -->
  <rect x="104" y="92" width="146" height="68" rx="14" fill="#ffffff" stroke="#18221e" stroke-width="2.4"/>
  <ellipse cx="250" cy="126" rx="12" ry="34" fill="#ece7de" stroke="#18221e" stroke-width="2.2"/>
  <ellipse cx="250" cy="126" rx="4.5" ry="12" fill="#b84a27"/>
  <!-- Dimension callout -->
  <line x1="84" y1="178" x2="272" y2="178" stroke="#244b3e" stroke-width="1.8"/>
  <line x1="84" y1="172" x2="84" y2="184" stroke="#244b3e" stroke-width="1.8"/>
  <line x1="272" y1="172" x2="272" y2="184" stroke="#244b3e" stroke-width="1.8"/>
  <text x="180" y="204" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4b5752">ORIGINAL EDITORIAL ILLUSTRATION · 12.2 IN RAIL · 5 OZ ALUMINUM</text>
</svg>
