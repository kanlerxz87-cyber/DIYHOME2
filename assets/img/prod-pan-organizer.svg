<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" role="img" aria-label="Editorial illustration of 8-tier adjustable under-cabinet pot and pan organizer">
  <rect width="360" height="220" rx="12" fill="#f3efe8"/>
  <!-- Cabinet outline -->
  <rect x="34" y="20" width="292" height="164" rx="6" fill="#faf8f4" stroke="#c8bfb0" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- Center iron frame -->
  <rect x="172" y="34" width="16" height="142" rx="3" fill="#18221e"/>
  <rect x="134" y="170" width="92" height="8" rx="3" fill="#18221e"/>
  <!-- Left 4 tiers & lightweight skillets -->
  <g stroke="#18221e" stroke-width="3.5" stroke-linecap="round">
    <line x1="82" y1="62" x2="172" y2="62"/>
    <line x1="82" y1="94" x2="172" y2="94"/>
    <line x1="82" y1="126" x2="172" y2="126"/>
    <line x1="82" y1="158" x2="172" y2="158"/>
  </g>
  <!-- Right 4 tiers -->
  <g stroke="#18221e" stroke-width="3.5" stroke-linecap="round">
    <line x1="188" y1="62" x2="278" y2="62"/>
    <line x1="188" y1="94" x2="278" y2="94"/>
    <line x1="188" y1="126" x2="278" y2="126"/>
    <line x1="188" y1="158" x2="278" y2="158"/>
  </g>
  <!-- Cookware silhouettes -->
  <rect x="92" y="50" width="70" height="10" rx="3" fill="#244b3e"/>
  <rect x="92" y="82" width="72" height="10" rx="3" fill="#b84a27"/>
  <rect x="92" y="114" width="74" height="10" rx="3" fill="#4b5752"/>
  <rect x="196" y="50" width="70" height="10" rx="3" fill="#4b5752"/>
  <rect x="196" y="82" width="72" height="10" rx="3" fill="#244b3e"/>
  <rect x="196" y="114" width="74" height="10" rx="3" fill="#b84a27"/>
  <text x="180" y="206" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4b5752">ORIGINAL EDITORIAL ILLUSTRATION · 21.31W × 9.17D × 16.61H IN · 10 LB/TIER</text>
</svg>
