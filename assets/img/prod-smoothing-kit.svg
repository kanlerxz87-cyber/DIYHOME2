<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" role="img" aria-label="Editorial illustration of peel-and-stick wallpaper smoothing tool kit">
  <rect width="360" height="220" rx="12" fill="#f3efe8"/>
  <!-- Subtle wall tile grid -->
  <g stroke="#e0d8cb" stroke-width="1">
    <line x1="30" y1="40" x2="330" y2="40"/>
    <line x1="30" y1="80" x2="330" y2="80"/>
    <line x1="30" y1="120" x2="330" y2="120"/>
    <line x1="30" y1="160" x2="330" y2="160"/>
    <line x1="90" y1="25" x2="90" y2="190"/>
    <line x1="180" y1="25" x2="180" y2="190"/>
    <line x1="270" y1="25" x2="270" y2="190"/>
  </g>
  <!-- Large smoothing blade -->
  <path d="M52 72 L188 72 L198 118 L42 118 Z" fill="#b84a27" stroke="#18221e" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="78" y="84" width="84" height="12" rx="6" fill="#faf8f4" opacity="0.9"/>
  <!-- Blue squeegee -->
  <rect x="218" y="64" width="92" height="58" rx="6" fill="#2c6b8c" stroke="#18221e" stroke-width="2.5"/>
  <rect x="218" y="112" width="92" height="10" rx="2" fill="#18221e"/>
  <!-- Utility knife -->
  <g transform="translate(62 142)">
    <rect x="0" y="6" width="118" height="20" rx="10" fill="#244b3e" stroke="#18221e" stroke-width="2.2"/>
    <polygon points="118,8 148,8 136,24 118,24" fill="#d8dde0" stroke="#18221e" stroke-width="2"/>
    <rect x="34" y="12" width="28" height="8" rx="4" fill="#faf8f4"/>
  </g>
  <!-- Measuring tape -->
  <circle cx="274" cy="158" r="24" fill="#e8b84b" stroke="#18221e" stroke-width="2.5"/>
  <circle cx="274" cy="158" r="9" fill="#faf8f4" stroke="#18221e" stroke-width="2"/>
  <rect x="220" y="172" width="54" height="10" rx="2" fill="#e8b84b" stroke="#18221e" stroke-width="2"/>
  <text x="180" y="206" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4b5752">ORIGINAL EDITORIAL ILLUSTRATION · 7.72 × 4.33 × 0.79 IN</text>
</svg>
