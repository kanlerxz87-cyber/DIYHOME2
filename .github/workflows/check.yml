name: Publication checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # scripts/build.py owns the publication; scripts/check.py owns local links,
      # XML, the doubled disclosure and Amazon reference markup. Both are the
      # other sessions' work and are run unchanged.
      - name: Build and run the publication checks
        run: python3 scripts/build.py && python3 scripts/check.py && git diff --exit-code

      # Added by arena/ecb1bfed-diyhome2. Covers what check.py does not: citation
      # register integrity, no rendered prices or star ratings, no shortener or
      # untagged Amazon product link, intended/observed separation, and nginx-free
      # sitemap/feed agreement.
      - name: Supplementary verification gate
        run: node scripts/verify.mjs

      # Three nested surfaces ship their own test suites, none of which the two
      # checks above reach: scripts/check.py globs non-recursively (root pages
      # only) and scripts/verify.mjs inspects markup, not behaviour. Until now
      # all three passed locally and ran nowhere in CI, so a regression on the
      # audit page, the counter-fit worksheet or the campaign desk collector
      # would have merged green. Added by arena/c776c14c-diyhome2.
      - name: Run the nested test suites
        run: |
          set -eo pipefail
          echo "::group::audit/check_audit.mjs"
          node audit/check_audit.mjs
          echo "::endgroup::"
          echo "::group::field-notes/counter-fit/test.cjs"
          node field-notes/counter-fit/test.cjs
          echo "counter-fit worksheet arithmetic and reset checks passed."
          echo "::endgroup::"
          echo "::group::measurement/test_desk.py"
          # `-m unittest`, not `python3 test_desk.py`: the file has no
          # `if __name__ == "__main__"` guard, so running it as a script imports
          # the test class and exits 0 having executed zero tests. The grep
          # guard below turns that silent pass into a failure.
          (cd measurement && python3 -m unittest test_desk -v) 2>&1 | tee /tmp/desk.log
          grep -qE '^Ran [1-9][0-9]* tests' /tmp/desk.log || { echo "::error::measurement suite ran no tests"; exit 1; }
          grep -q '^OK' /tmp/desk.log || { echo "::error::measurement suite did not report OK"; exit 1; }
          echo "::endgroup::"

      - name: Confirm the generated site is reproducible
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated output differs from committed files. Run the build and commit the result."
            git status --porcelain
            exit 1
          fi
          echo "Output is reproducible."

      - name: Summarise
        run: |
          {
            echo "### Publication checks passed"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            # `grep -o | wc -l`, not `grep -c`: both XML files are written by
            # ElementTree as a single line, so `grep -c` counted one matching
            # line and the summary reported "1" for a 14-URL sitemap on every
            # run. Fixed by arena/c776c14c-diyhome2.
            echo "| Published pages | $(find . -name '*.html' -not -path './.git/*' | wc -l) |"
            echo "| Sitemap URLs | $(grep -o '<loc>' sitemap.xml | wc -l) |"
            echo "| Feed items | $(grep -o '<item>' feed.xml | wc -l) |"
            echo "| Citation sources | $(node -e "console.log(require('./data/citation-register.json').sources.length)") |"
            echo "| Shop categories | $(ls category/*.html | wc -l) |"
            echo "| Open flags | $(node -e "console.log(require('./data/flags.json').flags.length)") |"
            echo "| Ledger rows | $(node -e "console.log(require('./data/campaign-ledger.json').rows.length)") |"
          } >> "$GITHUB_STEP_SUMMARY"
