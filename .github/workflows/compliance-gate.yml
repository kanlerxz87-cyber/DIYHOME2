name: DIYHOME2 Compliance Gate

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]

jobs:
  verify-compliance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild static site from verified JSON data
        run: node scripts/build_site.mjs

      - name: Run automated compliance gate and link verification
        run: node scripts/verify_site.mjs
