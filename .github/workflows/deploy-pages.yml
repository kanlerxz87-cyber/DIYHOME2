# GitHub Pages for this repo uses the legacy source (main /). This workflow does NOT deploy;
# it verifies that the committed static output passes the link check on every PR and push to main.
name: Verify site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Internal link + XML check
        run: python3 tools/check_links.py
