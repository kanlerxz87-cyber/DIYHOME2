name: Build and audit

# The publish gate. Runs on every push and every pull request.
# A red run means the site must not be published.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    name: Build, audit, verify no drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No `npm ci`: this repository has no dependencies. That is a feature —
      # a supply chain with nothing in it cannot be compromised.

      - name: Rebuild the site from data
        run: node scripts/build.mjs

      - name: Run the publish gate
        run: node scripts/audit.mjs

      - name: Fail if generated output differs from what is committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are out of date. Run 'node scripts/build.mjs' and commit the result."
            git status --porcelain
            git --no-pager diff | head -100
            exit 1
          fi
          echo "Generated output is reproducible and matches the committed files."

      - name: Check that no price or star rating is rendered anywhere
        run: |
          if grep -rlE '\$[0-9]+\.[0-9]{2}|out of 5 stars' --include='*.html' . ; then
            echo "::error::A rendered price or star rating was found. Both are prohibited on this site."
            exit 1
          fi
          echo "No rendered prices or star ratings."

      - name: Confirm every page carries the required disclosure twice
        run: |
          missing=0
          while IFS= read -r f; do
            n=$(grep -c "As an Amazon Associate I earn from qualifying purchases." "$f" || true)
            if [ "$n" -lt 2 ]; then
              echo "::error file=$f::disclosure appears $n time(s); expected at least 2"
              missing=$((missing+1))
            fi
          done < <(find . -name '*.html' -not -path './.git/*')
          if [ "$missing" -gt 0 ]; then exit 1; fi
          echo "Every page repeats the required statement at least twice."

      - name: Summarise
        run: |
          {
            echo "### Publish gate passed"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Pages generated | $(find . -name '*.html' -not -path './.git/*' | wc -l) |"
            echo "| Sitemap entries | $(grep -c '<loc>' sitemap.xml) |"
            echo "| Feed items | $(grep -c '<item>' feed.xml) |"
            echo "| Products | $(node -e 'console.log(require("./data/products.json").products.length)') |"
            echo "| Guides | $(node -e 'console.log(require("./data/guides.json").guides.length)') |"
            echo "| Open flags | $(node -e 'console.log(require("./data/flags.json").flags.length)') |"
          } >> "$GITHUB_STEP_SUMMARY"
